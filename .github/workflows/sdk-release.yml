name: SDK Release Sync

# 由 HFLink_SDK 仓库的 release workflow 通过 repository_dispatch 触发：
# 头文件从该 SDK release 的开发包获取，构建后以同名 tag 发布文档 release（附离线 HTML）。

on:
  repository_dispatch:
    types: [sdk-release]

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch SDK headers from release
        run: python scripts/fetch_headers.py --release "$SDK_TAG"
        env:
          SDK_TAG: ${{ github.event.client_payload.sdk_tag }}
          # HFLink_SDK 为私有仓库：需要对该仓库有 contents:read 的 PAT
          HF_LINK_SDK_TOKEN: ${{ secrets.DOCS_PAT }}

      - name: Tag this build
        run: git tag "$SDK_TAG"
        env:
          SDK_TAG: ${{ github.event.client_payload.sdk_tag }}

      - name: Generate Doxygen XML
        run: mkdir -p doxygen/xml && doxygen Doxyfile

      - name: Generate API stubs
        run: python scripts/gen_api_rst.py

      - name: Build site
        run: python -m sphinx -b html -W --keep-going source site

      - name: Pack offline HTML
        run: |
          cd site
          zip -r "../HFLinkSDK-docs-${SDK_TAG}.zip" .
        env:
          SDK_TAG: ${{ github.event.client_payload.sdk_tag }}

      - name: Create doc release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.sdk_tag }}
          name: "文档 ${{ github.event.client_payload.sdk_tag }}"
          body: "对应 HFLink_SDK ${{ github.event.client_payload.sdk_tag }} 的 API 文档与离线站点。"
          files: HFLinkSDK-docs-*.zip
